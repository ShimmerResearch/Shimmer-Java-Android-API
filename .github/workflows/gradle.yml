# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # the Publish Test Report step creates a check run

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded
    # dependencies and validation of the checked-in wrapper JARs.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    # No gradle-version is given on purpose: the build must run through the committed wrapper
    # so that CI and a local ./gradlew are the same build (DEV-1013).
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@ec92e829475ac0c2315ea8f9eced72db85bb337a # v3.0.0

    # Guards the exact command DEV-1013 was raised for: `cd ShimmerDriver && ./gradlew test`.
    - name: Test ShimmerDriver with the Gradle Wrapper
      working-directory: ShimmerDriver
      run: ./gradlew test

    # ShimmerDriverPC includes :ShimmerDriver and :ShimmerBluetoothManager as subprojects,
    # so this builds and tests those too.
    - name: Build ShimmerDriverPC with the Gradle Wrapper
      working-directory: ShimmerDriverPC
      run: ./gradlew build -i

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/build/test-results/test/*.xml'
