# The Shimmer protocol core (ShimmerProtocolCore, DEV-1134 spike): tested on Windows, macOS and
# Linux, run as WebAssembly in Node, and compiled for iOS and Android, all against the same
# recorded sessions and Java reference exports.
name: Protocol core

on:
  push:
    paths:
      - 'ShimmerProtocolCore/**'
      - 'ShimmerDriverPC/src/test/resources/protocol/**'
      - 'python/tests/data/**'
      - '.github/workflows/protocol-core.yml'
  pull_request:
    paths:
      - 'ShimmerProtocolCore/**'
      - 'ShimmerDriverPC/src/test/resources/protocol/**'
      - 'python/tests/data/**'
      - '.github/workflows/protocol-core.yml'
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ShimmerProtocolCore
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustc --version
      - name: Test
        run: cargo test --release

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShimmerProtocolCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - name: Build
        run: cargo rustc --lib --release --target wasm32-unknown-unknown --crate-type cdylib
      - name: Run on the recordings in Node
        run: node wasm/run_framing.mjs

  mobile:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ShimmerProtocolCore
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-linux-android
      - name: Compile for iOS
        run: cargo rustc --lib --release --target aarch64-apple-ios --crate-type staticlib
      - name: Compile for Android
        run: cargo rustc --lib --release --target aarch64-linux-android --crate-type staticlib
