[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shimmer3r"
version = "0.0.1"
description = "Shimmer3R over Bluetooth LE: an I/O-free protocol state machine and a bleak transport (DEV-1134 prototype)"
readme = "README.md"
requires-python = ">=3.10"
# The protocol, model and host need nothing beyond the standard library; only the BLE
# transport needs bleak.
dependencies = []

[project.optional-dependencies]
ble = ["bleak"]
test = ["pytest"]
dev = ["black"]

[tool.setuptools]
packages = ["shimmer3r"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
