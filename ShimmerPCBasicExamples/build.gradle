// Apply the java plugin to add support for Java
apply plugin: 'java'

sourceCompatibility = 1.11

// In this section you declare where to find the dependencies of your project
repositories {
    // Use 'jcenter' for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    jcenter()
    flatDir {
       dirs 'libs'
   }
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/ShimmerEngineering/Shimmer-Java-Android-API")
        credentials {
            /* Create gradle.properties file in GRADLE_USER_HOME/.gradle/ 
            (e.g. C:/Users/YourUsername/.gradle/) with the two lines listed below. Fill in your 
            Github ID and personal access token - as generated through the Github Developer 
            Settings page. The token needs to have "read:packages" scope enabled on it: 
                gpr.usr=GITHUB_USER_ID 
                gpr.key=PERSONAL_ACCESS_TOKEN 
            */
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

// In this section you declare the dependencies for your production and test code
dependencies {
    // The production code uses the SLF4J logging API at compile time
    implementation 'org.slf4j:slf4j-api:1.7.21'
    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-slf4j-impl
    testImplementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.21.1'

    // Declare the dependency for your favourite test framework you want to use in your tests.
    // TestNG is also supported by the Gradle Test task. Just change the
    // testCompile dependency to testCompile 'org.testng:testng:6.8.1' and add
    // 'test.useTestNG()' to your build script.
    testImplementation 'junit:junit:4.12'
    
    implementation project (':ShimmerDriver')
    implementation project (':ShimmerDriverPC')
	implementation project (':ShimmerBluetoothManager')
//    compile(group: 'com.shimmerresearch', name: 'shimmerdriver', version: '0.10.0_alpha')
//    compile(group: 'com.shimmerresearch', name: 'shimmerdriverpc', version: '0.10.0_alpha')
    
    implementation name: 'ShimmerBiophysicalProcessingLibrary_Rev_0_11'
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
}

// --- Native BLE examples (DEV-1132) ------------------------------------------------------------
// Need the native library: run ./gradlew buildNative in ../ShimmerDriverPC first, or pass
// -Dshimmer.ble.lib=<path>. On macOS, run from Terminal and allow Terminal to use Bluetooth.
tasks.withType(JavaExec).configureEach {
    // Forward the library override to the launched JVM.
    if (System.getProperty('shimmer.ble.lib')) {
        systemProperty 'shimmer.ble.lib', System.getProperty('shimmer.ble.lib')
    }
}

task runBleCapture(type: JavaExec) {
    group = 'native ble'
    description = 'Runs the Shimmer Capture-style BLE example (ShimmerBLECaptureExample)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shimmerresearch.simpleexamples.ShimmerBLECaptureExample'
}

// Example: ./gradlew runBleTest --args="--device Shimmer3R-2F31 --tests connect,stream"
task runBleTest(type: JavaExec) {
    group = 'native ble'
    description = 'Runs the BLE hardware test app; --args="--help" lists the options'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shimmerresearch.simpleexamples.bletest.BleHardwareTestApp'
    // The connection-loss test asks the operator to switch the device off and on.
    standardInput = System.in
}

// DEV-1134: the I/O-free Shimmer3R protocol state machine on a real device.
// Example: ./gradlew runProtocolLive --args="Shimmer3R-2F31 10"
task runProtocolLive(type: JavaExec) {
    group = 'native ble'
    description = 'Drives a real Shimmer3R with the DEV-1134 protocol state machine over native BLE'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shimmerresearch.simpleexamples.bletest.LogAndStreamProtocolLiveTest'
}

// Both capture-app backends (today's driver, new state machine) on a real device, headless.
// Example: ./gradlew runCaptureSmoke --args="Shimmer3R-2F31 5"
task runCaptureSmoke(type: JavaExec) {
    group = 'native ble'
    description = 'Runs both ShimmerBLECaptureExample backends against a real device and compares them'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shimmerresearch.simpleexamples.CaptureBackendSmokeTest'
}
